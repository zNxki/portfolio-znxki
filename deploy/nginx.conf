# /etc/nginx/sites-available/portfolio  — sostituisci example.com
# 1) Salva questo file così com'è (solo porta 80), 2) esegui: sudo certbot --nginx -d example.com
#    Certbot aggiunge da solo il blocco 443 e il redirect da HTTP a HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name znxki.it;

    server_tokens off;
    client_max_body_size 10m;   # >= MAX_UPLOAD_BYTES

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;   # il backend usa questo IP (TRUST_PROXY=true)
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
